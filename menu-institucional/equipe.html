<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipe — CerrAmazon</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    #conteudo .section {
      padding-bottom: 20px;
    }
    #conteudo .section-heading {
      margin-bottom: 24px;
    }
    .lista-equipe {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .membro-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      border-radius: 8px;
    }
    .membro-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #222;
    }
    .membro-info h3 {
      font-size: 1.2rem;
      margin-bottom: 4px;
      color: #fff;
    }
    .membro-info p {
      color: var(--text-muted, #999);
      font-size: 0.95rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <!-- O Header entra aqui automaticamente -->
  <div id="header-placeholder"></div>

  <!-- MIOLO / CONTEÚDO ESPECÍFICO DA PÁGINA -->
  <main id="conteudo" style="padding: 20px 20px 40px 20px; max-width: 1200px; margin: 0 auto;">
    <section class="section">
      <header class="section-heading">
        <p class="eyebrow">INSTITUCIONAL</p>
        <h2>Equipe</h2>
        <p>Quem faz acontecer e desenvolve a plataforma CerrAmazon.</p>
      </header>

      <!-- LISTA EMPILHADA DE MEMBROS -->
      <div class="lista-equipe">
        
        <!-- Membro 1 -->
        <div class="membro-card">
          <img src="https://lh3.googleusercontent.com/d/1Gfx_EaB7C-SUX4H981_RmygUjKn5dWpT=w1000" alt="Nome do Membro" class="membro-avatar" loading="lazy">
          <div class="membro-info">
            <h3>Nome do Membro 1</h3>
            <p>Pesquisador Principal / Coordenação Técnica</p>
          </div>
        </div>

        <!-- Membro 2 -->
        <div class="membro-card">
          <img src="https://lh3.googleusercontent.com/d/1EX0vHeM8qYNqQL1ssUMMbEO8FBT0MnZZ=w1000" alt="Nome do Membro" class="membro-avatar" loading="lazy">
          <div class="membro-info">
            <h3>Nome do Membro 2</h3>
            <p>Desenvolvimento e Arquitetura de Dados</p>
          </div>
        </div>

        <!-- Membro 3 -->
        <div class="membro-card">
          <img src="https://lh3.googleusercontent.com/d/1WCsDiHUBstOogzQ8wGMk2_M97_qgKQN5=w1000" alt="Nome do Membro" class="membro-avatar" loading="lazy">
          <div class="membro-info">
            <h3>Nome do Membro 3</h3>
            <p>Documentação e Relações Territoriais</p>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- O Footer entra aqui automaticamente -->
  <div id="footer-placeholder"></div>

  <!-- Header e Footer -->
  <script>
    const ROOT = '../';

    Promise.all([
      fetch(ROOT + 'header.html').then(resposta => resposta.text()),
      fetch(ROOT + 'footer.html').then(resposta => resposta.text())
    ]).then(([headerHtml, footerHtml]) => {
      document.getElementById('header-placeholder').innerHTML = headerHtml;
      document.getElementById('footer-placeholder').innerHTML = footerHtml;

      document.querySelectorAll('#header-placeholder a[href$=".html"], #footer-placeholder a[href$=".html"]')
        .forEach(a => a.setAttribute('href', ROOT + a.getAttribute('href')));

      document.querySelectorAll('#header-placeholder [data-root-src]')
        .forEach(el => {
          const srcOriginal = el.getAttribute('src');
          if (srcOriginal && !srcOriginal.startsWith('http')) {
            el.setAttribute('src', ROOT + srcOriginal);
          }
        });

      const scriptOriginal = document.createElement('script');
      scriptOriginal.src = ROOT + 'js/app.js';
      scriptOriginal.onload = () => { document.dispatchEvent(new Event('DOMContentLoaded')); };
      document.body.appendChild(scriptOriginal);
    });
  </script>
</body>
</html>
